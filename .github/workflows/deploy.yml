name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages n'existe pas sur Forgejo : ce workflow n'a de sens que sur GitHub.
    # Sans cette garde, chaque push sur main y declencherait un echec permanent.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      # Voir le commentaire du job `docusaurus-build` de ci.yml : bun.lock est le
      # seul lockfile du depot, donc `npm ci` n'est pas une option aujourd'hui.
      - name: Cache des dependances
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      # Docusaurus ecrit dans build/, mkdocs ecrivait dans site/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    # GitHub Pages n'existe pas sur Forgejo : ce workflow n'a de sens que sur GitHub.
    # Sans cette garde, chaque push sur main y declencherait un echec permanent.
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

