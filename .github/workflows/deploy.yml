name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages n'existe pas sur Forgejo : ce workflow n'a de sens que sur GitHub.
    # Sans cette garde, chaque push sur main y declencherait un echec permanent.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-mermaid2-plugin
  
      - name: Build site
        run: mkdocs build
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # GitHub Pages n'existe pas sur Forgejo : ce workflow n'a de sens que sur GitHub.
    # Sans cette garde, chaque push sur main y declencherait un echec permanent.
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

